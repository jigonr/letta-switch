# Pre-commit hooks for letta-switch (prek + biome via bun)
# See https://prek.j178.dev for more information

repos:
  # prek builtin hooks (Rust, zero dependencies)
  - repo: builtin
    rev: '0'
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']

  # biome: JS/TS/JSON linting and formatting (via bun)
  - repo: local
    hooks:
      - id: biome-lint
        name: Biome lint
        entry: bun run lint
        language: system
        types_or: [javascript, ts, json]
        pass_filenames: false

      - id: biome-format
        name: Biome format check
        entry: bun biome format --diagnostic-level=error .
        language: system
        types_or: [javascript, ts, json]
        pass_filenames: false

      - id: typecheck
        name: TypeScript type check
        entry: bun run typecheck
        language: system
        types: [ts]
        pass_filenames: false

  # Markdown formatting (dprint - Rust)
  - repo: local
    hooks:
      - id: dprint-markdown
        name: Format Markdown with dprint
        entry: /Users/j.i.gonzalez-rojas/.dprint/bin/dprint fmt --incremental
        language: system
        types: [markdown]

  # Conventional commits (commitlint-rs - Rust)
  - repo: https://github.com/KeisukeYamashita/commitlint-rs
    rev: v0.2.3
    hooks:
      - id: commitlint
        stages: [commit-msg]

fail_fast: false
